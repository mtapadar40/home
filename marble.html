<!DOCTYPE HTML>
<html>
<head>
    <title>Marble Run</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/main.css">

    <style>
        .video-page {
            padding: 30px 15px 50px;
            text-align: center;
        }

        .marble-video {
            display: block;
            width: 100%;
            max-width: 900px;
            max-height: 75vh;
            margin: 25px auto;
            background-color: black;
        }
    </style>
</head>

<body>

    <section class="head" id="header">
        <div class="wrapper">
            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <header class="header">
                            <div class="inner">

                                <a href="index.html" class="logo">
                                    <span class="symbol">
                                        <img src="images/logo.png" alt="Logo">
                                    </span>

                                    <span class="title">
                                        Mohammed Tapadar
                                    </span>
                                </a>

                            </div>
                        </header>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <main class="container video-page">
        <h1>Marble Run</h1>

        <video class="marble-video" controls preload="metadata" playsinline>
            <source src="images/marble_run_no_audio.mp4" type="video/mp4">
            Your browser does not support this video.
        </video>
    </main>

</body>
</html>
